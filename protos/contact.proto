syntax = "proto3";

package proto;
import "google/protobuf/timestamp.proto";
option go_package = "github.com/Artem09076/go_api/protos/gen/protos";

service ContactService {
  rpc CreateContact (CreateContactRequest) returns (Contact);
  rpc GetContact (GetContactRequest) returns (Contact);
  rpc UpdateContact (UpdateContactRequest) returns (Contact);
  rpc DeleteContact (DeleteContactRequest) returns (EmptyContact);
}

message Contact {
  string id = 1;
  string username = 2;
  string given_name = 3;
  string email = 4;
  google.protobuf.Timestamp birthday_date = 5;
  string group_id = 6;
}

message CreateContactRequest {
  string username = 1;
  string given_name = 2;
  string email = 3;
  google.protobuf.Timestamp birthday_date = 4;
  string group_id = 5;
}

message GetContactRequest {
  string id = 1;
}

message UpdateContactRequest {
  string id = 1;
  string username = 2;
  string given_name = 3;
  string email = 4;
  google.protobuf.Timestamp birthday_date = 5;
  string group_id = 6;
}

message DeleteContactRequest {
  string id = 1;
}

message EmptyContact {}